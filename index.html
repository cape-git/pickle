<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4f91">
<meta name="description" content="Run Americano and Mexicano pickleball tournaments. Data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickleball">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* Keep content clear of the notch and home bar when installed. */
  .wrap { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
  .topbar-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { top: 0; padding-top: env(safe-area-inset-top, 0px); }
</style>
<title>Pickleball Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* Layout: one narrow column (phone first). Sticky header with the settings gear,
     setup panel, then the current round as stacked court cards, then standings. */
  :root {
    --bg: #edf1f5;
    --surface: #ffffff;
    --surface-2: #f3f6f9;
    --line: #d3dbe4;
    --fg: #14202e;
    --muted: #5a6a7c;
    --accent: #1d4f91;
    --accent-fg: #ffffff;
    --accent-soft: #dfe9f6;
    --ball: #d9ea3f;
    --ball-fg: #2b3200;
    --danger: #b3261e;
    --danger-soft: #fbe4e2;
    --toast-bg: #14202e;
    --toast-fg: #f4f7fa;
    --toast-action: #d9ea3f;
    --shadow: 0 1px 2px rgba(20, 32, 46, .06), 0 4px 16px rgba(20, 32, 46, .06);
    --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1520; --surface: #152030; --surface-2: #1b2839; --line: #2a3a4e;
      --fg: #e6edf5; --muted: #92a3b7; --accent: #6aa5ec; --accent-fg: #071321; --accent-soft: #1d3250;
      --ball: #d9ea3f; --ball-fg: #2b3200; --danger: #ff8f86; --danger-soft: #3a1d1c;
      --toast-bg: #e6edf5; --toast-fg: #0d1520; --toast-action: #1d4f91;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1520; --surface: #152030; --surface-2: #1b2839; --line: #2a3a4e;
    --fg: #e6edf5; --muted: #92a3b7; --accent: #6aa5ec; --accent-fg: #071321; --accent-soft: #1d3250;
    --ball: #d9ea3f; --ball-fg: #2b3200; --danger: #ff8f86; --danger-soft: #3a1d1c;
    --toast-bg: #e6edf5; --toast-fg: #0d1520; --toast-action: #1d4f91;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body.no-scroll { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 120px; }

  /* Header */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 640px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-ball {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background:
      radial-gradient(circle at 30% 32%, var(--ball-fg) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at 66% 28%, var(--ball-fg) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at 50% 56%, var(--ball-fg) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at 26% 70%, var(--ball-fg) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at 74% 70%, var(--ball-fg) 0 1.6px, transparent 2.2px),
      var(--ball);
    opacity: .95;
  }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: 1.6rem; letter-spacing: .01em; text-transform: uppercase; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icon-btn {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .icon-btn:hover { color: var(--fg); }
  .icon-btn svg { width: 22px; height: 22px; }

  .note {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
    background: var(--danger-soft); color: var(--fg); font-size: .9rem;
  }

  /* Panels */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    margin-top: 14px;
  }
  .panel-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; background: none; border: 0; text-align: left;
  }
  .panel-title {
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .panel-sub { color: var(--muted); font-size: .85rem; }
  .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; flex: none; }
  .panel-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .panel-body { padding: 0 14px 14px; display: grid; gap: 10px; }

  .label {
    font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  }
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; padding: 3px; gap: 3px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  }
  .seg button {
    border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; font-weight: 600; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .hint { margin: 0; font-size: .85rem; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
    border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: .95rem;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .chip.pending { background: var(--ball); border-color: var(--ball); color: var(--ball-fg); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 4px; }

  .pair {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px;
    background: var(--ball); color: var(--ball-fg); border-radius: 999px; font-weight: 600; font-size: .95rem;
  }
  .pair.inactive { opacity: .5; }
  .pair button {
    width: 28px; height: 28px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: rgba(0, 0, 0, .12); color: var(--ball-fg);
  }
  .pair svg, .member-list svg { width: 14px; height: 14px; }

  .btn {
    border: 0; border-radius: 10px; padding: 14px 16px; font-weight: 700; font-size: 1rem;
    background: var(--accent); color: var(--accent-fg); min-height: 48px;
  }
  .btn.secondary { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
  .btn.warn { background: var(--ball); color: var(--ball-fg); }
  .btn.danger { background: var(--danger); color: var(--surface); }
  .btn.block { width: 100%; }
  .start-row { margin-top: 14px; }

  /* Tabs */
  .tabs { margin-top: 22px; }
  .tabs .seg button { font-size: 1rem; padding: 10px; }

  .round-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 18px 2px 10px; }
  h2 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 2rem;
    text-transform: uppercase; line-height: 1; text-wrap: balance;
  }
  .pill {
    font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  }
  .banner {
    display: grid; gap: 10px; padding: 12px 14px; margin-bottom: 12px;
    border-radius: var(--radius); background: var(--ball); color: var(--ball-fg); font-weight: 600;
  }

  /* Court cards */
  .courts { display: grid; gap: 12px; }
  .court {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .court.error { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
  .court-label {
    font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    margin-bottom: 6px; display: flex; justify-content: space-between;
  }
  .side { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 6px 0; }
  .side + .side { border-top: 1px dashed var(--line); }
  .names { min-width: 0; font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
  .names small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .score {
    width: 4.6rem; height: 3.6rem; text-align: center;
    font-family: var(--font-display); font-weight: 700; font-size: 2rem; font-variant-numeric: tabular-nums;
    border: 2px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--fg);
    padding: 0; -webkit-appearance: none; appearance: none;
  }
  .score:focus { border-color: var(--accent); background: var(--surface); outline: none; }
  .court-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .court-foot .btn { padding: 8px 16px; min-height: 40px; font-size: .9rem; }

  .bench { margin: 14px 2px 0; color: var(--muted); }
  .bench b { color: var(--fg); }
  .fair { margin: 4px 2px 14px; font-size: .85rem; color: var(--muted); }

  .empty {
    margin-top: 22px; padding: 22px 18px; text-align: center; color: var(--muted);
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .empty strong { display: block; color: var(--fg); font-size: 1.05rem; margin-bottom: 4px; }

  .results-round + .results-round { margin-top: 22px; }
  .results-round h3 {
    margin: 0 2px 8px; font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase;
  }

  /* Standings */
  .standings { margin-top: 28px; }
  .standings .toggles { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; margin: 10px 0; }
  .seg.seg3 { grid-template-columns: 1fr 1.3fr 1fr; }
  .seg.seg3 button { padding-left: 4px; padding-right: 4px; }
  .standings-note { margin-top: 8px; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 5px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface-2); }
  td.name, th.name { text-align: left; white-space: normal; }
  tr:last-child td { border-bottom: 0; }
  td.rank { color: var(--muted); width: 1.8em; }
  td.name, th.name { padding-left: 4px; }
  td.key { font-weight: 700; }
  .form { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; letter-spacing: .05em; }
  .form .w { color: var(--accent); font-weight: 700; }
  .form .l { color: var(--muted); }
  .form .d { color: var(--fg); }
  .label.sub { margin-top: 6px; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .backdrop { position: absolute; inset: 0; background: rgba(8, 14, 22, .5); cursor: pointer; }
  .sheet {
    position: relative; width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh;
    display: flex; flex-direction: column;
    background: var(--surface); color: var(--fg);
    border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .25);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (min-width: 600px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 18px; }
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 { font-size: 1.5rem; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; display: grid; gap: 22px; }
  .sheet-section { display: grid; gap: 10px; }
  .sheet-section h3 {
    margin: 0; display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-size: 1.2rem; text-transform: uppercase; letter-spacing: .04em;
  }
  .count { font-family: var(--font-body); font-size: .8rem; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 2px 8px; }
  .add-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .add-form input {
    min-width: 0; font-size: 16px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .add-form input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
  .field-error { margin: 0; color: var(--danger); font-size: .9rem; font-weight: 600; }
  .member-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); }
  .member-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 4px 4px 14px; min-height: 48px; }
  .member-list li + li { border-top: 1px solid var(--line); }
  .member-list span { min-width: 0; overflow-wrap: anywhere; }
  .member-list button {
    width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: var(--danger-soft); color: var(--danger);
  }
  .member-list li.new { background: var(--accent-soft); }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-grid .wide { grid-column: 1 / -1; }

  .dialog {
    position: relative; width: calc(100% - 32px); max-width: 400px; margin: auto;
    background: var(--surface); border-radius: 16px; padding: 20px; display: grid; gap: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
  }
  .overlay.center { align-items: center; }
  .dialog h2 { font-size: 1.5rem; }
  .dialog p { margin: 0; color: var(--muted); }

  .toast {
    position: fixed; z-index: 80; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: calc(100% - 32px); max-width: 480px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-fg);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25); font-size: .95rem;
  }
  .toast button { border: 0; background: none; color: var(--toast-action); font-weight: 700; padding: 6px 8px; flex: none; }


  /* Section title with a PDF button */
  .section-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 2px 12px; }
  .mini-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
    font-weight: 700; font-size: .9rem;
  }
  .mini-btn svg { width: 18px; height: 18px; }
  .check-list { display: grid; gap: 8px; }
  .check-row {
    display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start;
    padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); cursor: pointer;
  }
  .check-row input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); }
  .check-row small { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .btn:disabled { opacity: .6; cursor: progress; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-ball" aria-hidden="true"></span><h1>Pickleball Tournament</h1></div>
    <button type="button" class="icon-btn" id="settingsBtn" data-action="open-settings" aria-label="Settings: club members">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <p class="note" id="storageNote" hidden>This browser isn't saving data (private browsing or blocked site data). Your tournament will be lost if you close the page. Open settings and use Export to keep a copy.</p>
  <div id="setup"></div>
  <div id="main"></div>
  <div id="standings"></div>
</div>

<div id="overlayRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button type="button" id="toastAction" hidden></button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function () {
  'use strict';

  // ── Config ───────────────────────────────────────────────────────────────
  var STORE_KEY = 'pickleball-tournament-v1';
  var DEFAULT_MEMBERS = [];  // New installs start empty: add members, or import a member list.

  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15l3 3 3-3"/></svg>';
  var ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  // ── Small helpers ────────────────────────────────────────────────────────
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cleanName(s) { return String(s).replace(/\s+/g, ' ').trim(); }
  function sameName(a, b) { return a.toLowerCase() === b.toLowerCase(); }
  function sortNames(list) {
    return list.slice().sort(function (a, b) { return a.localeCompare(b, undefined, { sensitivity: 'base' }); });
  }
  function contains(list, x) { return list.indexOf(x) !== -1; }
  function shuffle(array) {
    var a = array.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));

  // ── PDF export ───────────────────────────────────────────────────────────
  var PDF_LIBS = ['lib/jspdf.umd.min.js', 'lib/jspdf.plugin.autotable.min.js'];
  var pdfLibsPromise = null;
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Could not load ' + src)); };

  }
  function loadPdfLibs() {
    if (window.jspdf && window.jspdf.jsPDF && (window.autoTable || (window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable))) return Promise.resolve();
    if (!pdfLibsPromise) {
      pdfLibsPromise = PDF_LIBS.reduce(function (p, src) { return p.then(function () { return loadScript(src); }); }, Promise.resolve())
        .catch(function (err) { pdfLibsPromise = null; throw err; });
    }
    return pdfLibsPromise;
  }

  function standingsRows(view, rankBy) {
    var t = S.t, st = stats(), rows = [];
    var blank = { pf: 0, pa: 0, wins: 0, draws: 0, losses: 0, bench: 0, form: [], pts: 0, diff: 0 };
    if (view === 'teams') {
      comparableTeams().forEach(function (p) { rows.push({ label: joinTeam(p), s: st[p[0]] || blank }); });
    } else {
      t.players.forEach(function (p) { rows.push({ label: p, s: st[p] || blank }); });
    }
    var cmp = RANKERS[rankBy] || RANKERS.points;
    rows.sort(function (a, b) { return cmp(a.s, b.s); });
    return rows;
  }

  function buildPdf(withStandings, withResults, outType) {
    var t = S.t;
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: 'pt', format: 'a4' });
    var table = function (opts) {
      if (typeof doc.autoTable === 'function') doc.autoTable(opts);
      else window.autoTable(doc, opts);
      return doc.lastAutoTable.finalY;
    };
    var M = 40, W = doc.internal.pageSize.getWidth();
    var BLUE = [29, 79, 145], INK = [20, 32, 46], MUTED = [90, 106, 124], LINE = [211, 219, 228], SOFT = [243, 246, 249];
    var modes = {};
    t.rounds.forEach(function (r) { modes[r.mode === 'mexicano' ? 'Mexicano' : 'Americano'] = true; });
    var modeText = Object.keys(modes).join(' + ') || (S.mode === 'mexicano' ? 'Mexicano' : 'Americano');
    var dateText = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

    // Header band
    doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]);
    doc.rect(0, 0, W, 6, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(INK[0], INK[1], INK[2]);
    doc.text('Pickleball Tournament', M, 50);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
    doc.text(dateText + '   |   ' + modeText + '   |   ' + t.players.length + ' players   |   ' +
      t.rounds.length + (t.rounds.length === 1 ? ' round played' : ' rounds played'), M, 68);
    var y = 92;

    var base = {
      margin: { left: M, right: M, bottom: 50 },
      theme: 'grid',
      styles: { font: 'helvetica', fontSize: 10, cellPadding: 5, lineColor: LINE, lineWidth: 0.5, textColor: INK },
      headStyles: { fillColor: SOFT, textColor: MUTED, fontStyle: 'bold', fontSize: 8 },
      alternateRowStyles: { fillColor: [251, 252, 253] }
    };
    function merge(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b) o[k] = b[k]; return o; }
    function heading(text, sub) {
      if (y > doc.internal.pageSize.getHeight() - 120) { doc.addPage(); y = 50; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(INK[0], INK[1], INK[2]);
      doc.text(text, M, y);
      if (sub) {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text(sub, W - M, y, { align: 'right' });
      }
      y += 8;
    }
    function standingsTable(view, title) {
      var rows = standingsRows(view, S.rankBy);
      if (!rows.length) return;
      heading(title, 'Ranked by ' + (RANK_NAMES[S.rankBy] || 'points') + '   |   win 2 pts, draw 1');
      var cols = standCols(S.rankBy, hasDraws(), true);
      var n = cols.length;
      y = table(merge(base, {
        startY: y,
        head: [['#', view === 'teams' ? 'Team' : 'Player']
          .concat(cols.map(function (c) { return c.h; }))
          .concat(['For', 'Against', 'Bench', 'Form'])],
        body: rows.map(function (r, i) {
          return [i + 1, r.label]
            .concat(cols.map(function (c) { return c.v(r.s); }))
            .concat([r.s.pf, r.s.pa, r.s.bench, r.s.form.join(' ') || '-']);
        }),
        columnStyles: (function () {
          var cs = { 0: { halign: 'center', cellWidth: 24, textColor: MUTED }, 2: { halign: 'center', cellWidth: 34, fontStyle: 'bold' } };
          for (var k = 3; k < 2 + n; k++) cs[k] = { halign: 'center', cellWidth: 30 };
          cs[2 + n] = { halign: 'center', cellWidth: 36 };
          cs[3 + n] = { halign: 'center', cellWidth: 46 };
          cs[4 + n] = { halign: 'center', cellWidth: 38 };
          cs[5 + n] = { font: 'courier', fontSize: 9 };
          return cs;
        })()
      })) + 26;
    }

    if (withStandings) {
      standingsTable('individual', 'Standings');
      if (comparableTeams().length) standingsTable('teams', 'Locked teams');
    }

    if (withResults) {
      heading('Results', t.current ? 'Round ' + t.current.n + ' is in progress and not included' : '');
      if (!t.rounds.length) {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text('No rounds have been submitted yet.', M, y + 14);
        y += 30;
      } else {
        var body = [];
        t.rounds.forEach(function (r) {
          body.push([{
            content: 'Round ' + r.n + (r.mode === 'mexicano' ? '  (Mexicano)' : '') +
              '      Bench: ' + (r.bench.length ? r.bench.join(', ') : 'nobody'),
            colSpan: 4,
            styles: { fillColor: [223, 233, 246], fontStyle: 'bold', textColor: INK }
          }]);
          r.courts.forEach(function (c, ci) {
            var win = c.score[0] === c.score[1] ? -1 : (c.score[0] > c.score[1] ? 0 : 1);
            body.push([
              { content: 'Court ' + (ci + 1), styles: { textColor: MUTED } },
              { content: joinTeam(c.teams[0]), styles: { fontStyle: win === 0 ? 'bold' : 'normal' } },
              { content: c.score[0] + ' - ' + c.score[1], styles: { halign: 'center', fontStyle: 'bold' } },
              { content: joinTeam(c.teams[1]), styles: { fontStyle: win === 1 ? 'bold' : 'normal' } }
            ]);
          });
        });
        y = table(merge(base, {
          startY: y,
          head: [['Court', 'Team 1', 'Score', 'Team 2']],
          body: body,
          alternateRowStyles: {},
          columnStyles: { 0: { cellWidth: 52 }, 2: { cellWidth: 60 } }
        })) + 20;
      }
    }

    // Footer on every page
    var pages = doc.internal.getNumberOfPages();
    for (var p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      doc.text('Winning team in bold (no bold for a draw). Generated ' + dateText + '.', M, doc.internal.pageSize.getHeight() - 24);
      doc.text('Page ' + p + ' of ' + pages, W - M, doc.internal.pageSize.getHeight() - 24, { align: 'right' });
    }
    return doc.output(outType || 'blob');
  }

  // Accepts a member-list file, an older full backup, or a plain JSON list of names.
  function membersFromFile(parsed) {

  function importFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed, members;
      try { parsed = JSON.parse(reader.result); } catch (e) { parsed = null; }
      members = membersFromFile(parsed);
      if (!members) { toast("That file isn't a member list from this app."); return; }
      var before = JSON.stringify(S);
      var known = S.members.slice(), wasSelected = S.selected.slice();
      // Replace only the member list. Names that were already here keep their
      // "playing today" choice; new names start selected. Rounds, results and
      // settings are left as they are.
      var o = JSON.parse(before);
      o.members = members;
      o.selected = members.filter(function (m) { return !contains(known, m) || contains(wasSelected, m); });
      var next = normalize(o);
      if (!next) { toast("That file isn't a member list from this app."); return; }

      html += '<p class="fair">Nobody sits out with ' + t.players.length + ' players.</p>';
    }
    html += '<button type="button" class="btn block" data-action="submit">Submit round ' + cur.n + '</button>';
    el.innerHTML = html;
  }

  function renderStandings() {
    var t = S.t, el = $('standings');
    if (!t) { el.innerHTML = ''; return; }
    var by = RANKERS[S.rankBy] ? S.rankBy : 'points';
    var rows = standingsRows(S.standView === 'teams' ? 'teams' : 'individual', by);
    var cols = standCols(by, hasDraws(), false);
    var head = cols.map(function (c) { return '<th>' + c.h + '</th>'; }).join('');
    var body = rows.length ? rows.map(function (r, i) {
      var cells = cols.map(function (c, k) { return '<td' + (k === 0 ? ' class="key"' : '') + '>' + c.v(r.s) + '</td>'; }).join('');
      var form = r.s.form.slice(-8).map(function (x) { return '<span class="' + x.toLowerCase() + '">' + x + '</span>'; }).join('');
      return '<tr><td class="rank">' + (i + 1) + '</td><td class="name">' + esc(r.label) + '</td>' + cells + '<td>' + r.s.bench + '</td><td class="form">' + (form || '–') + '</td></tr>';
    }).join('') : '<tr><td colspan="' + (cols.length + 4) + '" class="name" style="color:var(--muted)">' + (changedTeams().length ? 'No locked team has played together for the whole tournament.' : 'No locked teams are playing in this tournament.') + '</td></tr>';
    var changed = S.standView === 'teams' ? changedTeams() : [];
    var changedNote = changed.length
      ? '<p class="hint standings-note">Not in the team comparison: ' + esc(changed.map(joinTeam).join(', ')) +
        '. ' + (changed.length === 1 ? 'This team was' : 'These teams were') + ' changed during the tournament, so the players are only ranked individually.</p>'
      : '';
    var rb = function (v, label) { return '<button type="button" data-action="rank-by" data-v="' + v + '" aria-pressed="' + (by === v) + '">' + label + '</button>'; };

    el.innerHTML = '<section class="standings"><div class="section-row"><h2>Standings</h2><button type="button" class="mini-btn" data-action="pdf" data-preset="standings">' + ICON_PDF + 'PDF</button></div>' +
      '<div class="toggles">' +
        '<div class="seg" role="group" aria-label="Show"><button type="button" data-action="stand-view" data-v="individual" aria-pressed="' + (S.standView === 'individual') + '">Players</button><button type="button" data-action="stand-view" data-v="teams" aria-pressed="' + (S.standView === 'teams') + '">Teams</button></div>' +
        '<div class="seg seg3" role="group" aria-label="Rank by">' + rb('diff', '+/-') + rb('points', 'Points') + rb('record', 'Wins') + '</div>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>#</th><th class="name">' + (S.standView === 'teams' ? 'Team' : 'Player') + '</th>' + head + '<th>Bench</th><th>Form</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      changedNote +
      '<p class="hint standings-note">Points: win 2, draw 1, loss 0. +/- is score for minus score against.</p></section>';
  }

  function render() { renderSetup(); renderMain(); renderStandings(); $('storageNote').hidden = storageOK; }

  // ── Settings sheet ───────────────────────────────────────────────────────
  function openSettings() {
    ui.settingsOpen = true;
    ui.newMember = null;
    $('overlayRoot').innerHTML =
      '<div class="overlay" id="settingsOverlay">' +
        '<div class="backdrop" data-action="close-settings"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">' +
          '<div class="sheet-head"><h2 id="settingsTitle">Settings</h2>' +
            '<button type="button" class="icon-btn" data-action="close-settings" aria-label="Close settings">' + ICON_X + '</button></div>' +
          '<div class="sheet-body">' +
            '<section class="sheet-section">' +
              '<h3>Club members <span class="count" id="memberCount"></span></h3>' +
              '<form class="add-form" id="addForm" novalidate>' +
                '<input id="newMember" type="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="40" placeholder="New member name" aria-label="New member name">' +
                '<button type="submit" class="btn">Add</button>' +
              '</form>' +
              '<p class="field-error" id="addError" role="alert" hidden></p>' +
              '<ul class="member-list" id="memberList"></ul>' +
            '</section>' +
            '<section class="sheet-section">' +
              '<h3>Member list</h3>' +
              '<p class="hint">Export the member list to share it or keep a copy. Importing replaces the member list on this phone. Rounds and results are not touched.</p>' +
              '<div class="btn-grid">' +
                '<button type="button" class="btn secondary" data-action="export">Export members</button>' +
                '<button type="button" class="btn secondary" data-action="import">Import members</button>' +
              '</div>' +
            '</section>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.classList.add('no-scroll');
    renderMemberList();
  }

  function renderMemberList() {
    var list = $('memberList');
    if (!list) return;
    $('memberCount').textContent = S.members.length;
    list.innerHTML = S.members.length
      ? S.members.map(function (m, i) {
          return '<li' + (m === ui.newMember ? ' class="new"' : '') + '><span>' + esc(m) + '</span>' +
            '<button type="button" data-action="remove-member" data-i="' + i + '" aria-label="Remove ' + esc(m) + '">' + ICON_X + '</button></li>';
        }).join('')
      : '<li><span class="hint">No members yet. Add the first one above.</span></li>';
  }

  function closeOverlay() {
    ui.settingsOpen = false;
    $('overlayRoot').innerHTML = '';
    document.body.classList.remove('no-scroll');
  }

  var confirmFn = null;
  function confirmDialog(title, text, okLabel, onOk) {
    confirmFn = onOk;
    $('overlayRoot').innerHTML =
      '<div class="overlay center">' +
        '<div class="backdrop" data-action="close-overlay"></div>' +
        '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">' +
          '<h2 id="dlgTitle">' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
          '<div class="btn-grid"><button type="button" class="btn secondary" data-action="close-overlay">Cancel</button>' +
          '<button type="button" class="btn danger" data-action="confirm-ok">' + esc(okLabel) + '</button></div>' +
        '</div>' +
      '</div>';
    document.body.classList.add('no-scroll');
  }

  // ── Events (one delegated listener; no inline onclick) ───────────────────
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var a = el.getAttribute('data-action');
    var i = parseInt(el.getAttribute('data-i'), 10);
    switch (a) {
      case 'open-settings': openSettings(); break;
      case 'close-settings':
      case 'close-overlay': closeOverlay(); break;
      case 'confirm-ok': { var fn = confirmFn; confirmFn = null; closeOverlay(); if (fn) fn(); break; }
      case 'mode': S.mode = el.getAttribute('data-mode'); save(); render(); break;
      case 'toggle-section': {
        var key = el.getAttribute('data-section');
        ui.open[key] = !sectionOpen(key); render(); break;
      }
      case 'toggle-player': if (S.members[i] != null) togglePlayer(S.members[i]); break;
      case 'select-all': selectAll(true); break;
      case 'select-none': selectAll(false); break;
      case 'pick-lock': { var pool = lockPool(); if (pool[i] != null) pickLock(pool[i]); break; }
      case 'unlock': unlock(i); break;
      case 'start': startTournament(); break;
      case 'submit': submitRound(); break;
      case 'rebuild': rebuildRound(); break;
      case 'next-round': nextRound(); break;
      case 'tab': S.tab = el.getAttribute('data-tab'); save(); renderMain(); break;
      case 'save-result': saveResult(parseInt(el.getAttribute('data-r'), 10), parseInt(el.getAttribute('data-c'), 10)); break;
      case 'stand-view': S.standView = el.getAttribute('data-v'); save(); renderStandings(); break;
      case 'rank-by': { var v = el.getAttribute('data-v'); S.rankBy = RANKERS[v] ? v : 'points'; save(); renderStandings(); break; }
      case 'scoring':
        S.scoring = el.getAttribute('data-v') === 'draw' ? 'draw' : 'win2';
        ui.errorCourt = -1;
        save(); renderSetup(); renderMain();
        break;
      case 'remove-member': if (S.members[i] != null) removeMember(S.members[i]); break;
      case 'export': exportData(); break;
      case 'import': $('importFile').click(); break;
      case 'pdf': openPdfDialog(el.getAttribute('data-preset')); break;
      case 'pdf-go': createPdf(); break;
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'addForm') {
      e.preventDefault();
      var input = $('newMember');
      var err = addMember(input.value);
      var errEl = $('addError');
      if (err) {
        errEl.textContent = err; errEl.hidden = false;
      } else {
        errEl.hidden = true;
        input.value = '';
        renderMemberList(); render();
        toast('Added ' + ui.newMember + '.');
      }
      input.focus();
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el && el.id === 'newMember') { $('addError').hidden = true; return; }
    if (el && (el.id === 'pdfStandings' || el.id === 'pdfResults')) { var pe = $('pdfError'); if (pe) pe.hidden = true; return; }
    if (!el || !el.classList || !el.classList.contains('score')) return;
    var digits = el.value.replace(/[^0-9]/g, '').slice(0, 2);
    if (digits !== el.value) el.value = digits;
    var c = el.getAttribute('data-court');
    if (c !== null && S.t && S.t.current) {
      var court = S.t.current.courts[parseInt(c, 10)];
      if (court) {
        court.draft[parseInt(el.getAttribute('data-side'), 10)] = digits;
        if (ui.errorCourt === parseInt(c, 10)) { ui.errorCourt = -1; var card = el.closest('.court'); if (card) card.classList.remove('error'); }
        save();
      }
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el && (el.id === 'pdfStandings' || el.id === 'pdfResults')) { var pe = $('pdfError'); if (pe) pe.hidden = true; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('overlayRoot').innerHTML) closeOverlay();
  });

  // ── Start up ─────────────────────────────────────────────────────────────
  probeStorage();
  render();
  if (location.hash === '#settings') openSettings();
  if (firstRun) {
    save();
  }

  // Ask the browser to keep our data even when the device is low on space.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* ignore */ }

  // Offline support when installed as an app.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* not available here */ });
    });
  }

  // Exposed for tests only.
  window.__pickleball = { get state() { return S; }, stats: stats, render: render, buildPdf: buildPdf };
})();
</script>
</body>
</html>
